extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    fsync: true
    max_size: 134217728  # 128 MiB per queue database
    compaction:
      on_rebound: true
      rebound_needed_threshold_mib: 64
      rebound_trigger_threshold_mib: 8
      check_interval: 1m
      directory: /var/lib/otelcol/file_storage/compaction
      cleanup_on_start: true

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'pumphouse'
          scrape_interval: 30s
          static_configs:
            - targets: ['127.0.0.1:8888']
              labels:
                instance: '192.168.80.60:8888'
  atlasph:
  sparkplug:
    broker:
      host_id: waterco
      self_hosted: true
      endpoint: :1883
    metrics:
      - well_depth_value
      - system_pressure_value
      - chlorine_level_value
      - concrete_tank_level_value

exporters:
  otelarrow:
    endpoint: 192.168.80.40:4317
    tls:
      insecure: true
    timeout: 10m
    retry_on_failure:
      max_elapsed_time: 0s
    sending_queue:
      storage: file_storage
      num_consumers: 1
    arrow:
      num_streams: 1
      max_stream_lifetime: 1h

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers:
      - atlasph
      - sparkplug
      - prometheus
      processors: []
      exporters:
      - otelarrow
  telemetry:
    logs:
      level: debug
    metrics:
      level: none
