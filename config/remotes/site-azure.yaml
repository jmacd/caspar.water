# Azure override for site-prod imports.
#
# This document is self-contained so a fresh Azure-only site pond does not
# need to attach transient MinIO remotes first.

version: v1
kind: mknod
metadata:
  path: /sys/storage/azure
spec:
  factory: storage-azure
  config:
    account_name: "${env:AZURE_STORAGE_ACCOUNT}"
    timeout: 2m
    service_principal:
      client_id: "${env:AZURE_CLIENT_ID}"
      client_secret: "${env:AZURE_CLIENT_SECRET}"
      tenant_id: "${env:AZURE_TENANT_ID}"
---
version: v1
kind: mknod
metadata:
  path: /sys/limits/pull-bytes
spec:
  factory: rate-limit
  config:
    unit: MiB/day
    limit: "${env:PULL_MIB_PER_DAY:-1024}"
    burst: 64
---
version: v1
kind: mknod
metadata:
  path: /sys/limits/pull-ops
spec:
  factory: rate-limit
  config:
    unit: ops/day
    limit: "${env:PULL_OPS_PER_DAY:-100000}"
    burst: 20000
---
version: v1
kind: remote
metadata:
  path: /sys/remotes/water
spec:
  url: "${env:WATER_AZURE_URL}"
  mount: /sources/water
  storage: /sys/storage/azure
  overwrite: true
  limits:
    bytes: /sys/limits/pull-bytes
    ops: /sys/limits/pull-ops
---
version: v1
kind: remote
metadata:
  path: /sys/remotes/noyo
spec:
  url: "${env:NOYO_AZURE_URL}"
  mount: /sources/noyo
  storage: /sys/storage/azure
  overwrite: true
  limits:
    bytes: /sys/limits/pull-bytes
    ops: /sys/limits/pull-ops
---
version: v1
kind: remote
metadata:
  path: /sys/remotes/septic
spec:
  url: "${env:SEPTIC_AZURE_URL}"
  mount: /sources/septic
  storage: /sys/storage/azure
  overwrite: true
  limits:
    bytes: /sys/limits/pull-bytes
    ops: /sys/limits/pull-ops
