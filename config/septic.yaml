version: v1
kind: mkdir
metadata:
  path: /ingest
---
version: v1
kind: mknod
metadata:
  path: /etc/ingest
spec:
  factory: logfile-ingest
  config:
    archived_pattern: /data/septicstation-*.json
    active_pattern: /data/septicstation.json
    pond_path: /ingest
    # Record each version's event-time range at ingest.
    #
    # temporal-reduce keys its partial-aggregate cache on the event-time range
    # of each source version.  A version without one is taken to span ALL of
    # time, so the dirty range reaches the beginning of time, every sealed
    # segment is dropped, and the rollup recomputes its entire history on every
    # build.  That is what pinned the site pond at ~2.05 GB: site imports this
    # pond at /sources/<name> and re-executes the temporal-reduce recipe below
    # over the REPLICATED ingest data, so unbounded versions here cost memory
    # there too.
    #
    # The values match the OTLP JSON the stations emit, where each data point
    # carries "timeUnixNano" in nanoseconds since the epoch.
    #
    # Requires an image with watertown#127; LogfileIngestConfig is
    # deny_unknown_fields, so these keys fail to parse on an older pond.
    # As of #127 naming a field also declares the node temporal, so a field
    # that matches no record fails the run rather than silently storing an
    # unbounded version.  Both values below were checked against the live
    # archive on watershop before being set.
    timestamp_field: timeUnixNano
    timestamp_unit: nanoseconds
---
version: v1
kind: mknod
metadata:
  path: /reduced
spec:
  factory: dynamic-dir
  config:
    # Six temporal-reduce groups covering all 25 active Modbus/BME280 variables.
    #
    # Resolutions: 1h for detail, 6h/1d for mid-range, 1w for full-range overview.
    # The 1w resolution lets sitegen cover multi-year spans in ≤2 partition files,
    # avoiding the "cannot cover max_width" warning on the coarsest zoom level.
    #
    # Early log entries had mangled column names (double-underscore prefix) from a
    # misconfigured otelcol; those are inactive and excluded here.
    #
    # allowed_lateness (14d): STALE RATIONALE, VALUE NOT RE-DERIVED.
    #
    # This mirrored the water.yaml setting, which existed to avoid a hard
    # error when `maintain --collapse-versions 100` rewrote a reduced
    # series' tail behind the sealed watermark. watertown #123 keyed
    # segments on bucket range, so late data now unseals and recomputes the
    # covering segments rather than aborting. The failure is gone; see the
    # longer note in water.yaml for the mechanism.
    #
    # These nodes are even less likely than water's to be affected by the
    # value at all. Sealing needs the hot window to reach SEAL_TARGET_BYTES
    # (1 MiB) before anything freezes, and the finest resolution here is 1h
    # -- 14d is only ~336 buckets of a handful of columns. Reaching 1 MiB
    # takes far longer than the lateness window, so the size gate binds,
    # nothing seals for a long time, and reads stay unbounded regardless of
    # what this is set to. That is the intended behaviour, not a defect: the
    # gate exists so a pond rebuilt hourly does not accumulate tiny segment
    # files, and at this data volume a full rescan is cheap.
    #
    # Left at 14d deliberately -- changing it invalidates the merged segment
    # cache, and on this node it should make no difference either way.
    
    entries:
      # ── Pump Amps ────────────────────────────────────────────────────────────
      - name: "pumps"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "orenco_RT_Pump1_Amps"
                - "orenco_RT_Pump2_Amps"
                - "orenco_DT_Pump3_Amps"
                - "orenco_DT_Pump4_Amps"
            - type: "min"
              columns:
                - "orenco_RT_Pump1_Amps"
                - "orenco_RT_Pump2_Amps"
                - "orenco_DT_Pump3_Amps"
                - "orenco_DT_Pump4_Amps"
            - type: "max"
              columns:
                - "orenco_RT_Pump1_Amps"
                - "orenco_RT_Pump2_Amps"
                - "orenco_DT_Pump3_Amps"
                - "orenco_DT_Pump4_Amps"
    
      # ── Pump Cycle Times ────────────────────────────────────────────────────
      - name: "cycle-times"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "orenco_RT_Pump1_CT"
                - "orenco_RT_Pump2_CT"
                - "orenco_DT_Pump3_CT"
                - "orenco_DT_Pump4_CT"
            - type: "min"
              columns:
                - "orenco_RT_Pump1_CT"
                - "orenco_RT_Pump2_CT"
                - "orenco_DT_Pump3_CT"
                - "orenco_DT_Pump4_CT"
            - type: "max"
              columns:
                - "orenco_RT_Pump1_CT"
                - "orenco_RT_Pump2_CT"
                - "orenco_DT_Pump3_CT"
                - "orenco_DT_Pump4_CT"
    
      # ── Pump Modes ──────────────────────────────────────────────────────────
      - name: "pump-modes"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "orenco_RT_PumpMode"
                - "orenco_DT_PumpMode"
            - type: "min"
              columns:
                - "orenco_RT_PumpMode"
                - "orenco_DT_PumpMode"
            - type: "max"
              columns:
                - "orenco_RT_PumpMode"
                - "orenco_DT_PumpMode"
    
      # ── Flow Totals ─────────────────────────────────────────────────────────
      - name: "flow-totals"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "orenco_RT_TotalCount"
                - "orenco_RT_TotalFlow"
                - "orenco_RT_TotalTime"
                - "orenco_DT_TotalCount"
                - "orenco_DT_TotalFlow"
                - "orenco_DT_TotalTime"
            - type: "min"
              columns:
                - "orenco_RT_TotalCount"
                - "orenco_RT_TotalFlow"
                - "orenco_RT_TotalTime"
                - "orenco_DT_TotalCount"
                - "orenco_DT_TotalFlow"
                - "orenco_DT_TotalTime"
            - type: "max"
              columns:
                - "orenco_RT_TotalCount"
                - "orenco_RT_TotalFlow"
                - "orenco_RT_TotalTime"
                - "orenco_DT_TotalCount"
                - "orenco_DT_TotalFlow"
                - "orenco_DT_TotalTime"
    
      # ── Dose Zones ──────────────────────────────────────────────────────────
      - name: "dose-zones"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "orenco_Zone1_CountTday"
                - "orenco_Zone1_TimeTday"
                - "orenco_Zone2_CountTday"
                - "orenco_Zone2_TimeTday"
                - "orenco_Zone3_CountTday"
                - "orenco_Zone3_TimeTday"
            - type: "min"
              columns:
                - "orenco_Zone1_CountTday"
                - "orenco_Zone1_TimeTday"
                - "orenco_Zone2_CountTday"
                - "orenco_Zone2_TimeTday"
                - "orenco_Zone3_CountTday"
                - "orenco_Zone3_TimeTday"
            - type: "max"
              columns:
                - "orenco_Zone1_CountTday"
                - "orenco_Zone1_TimeTday"
                - "orenco_Zone2_CountTday"
                - "orenco_Zone2_TimeTday"
                - "orenco_Zone3_CountTday"
                - "orenco_Zone3_TimeTday"
    
      # ── Environment (BME280) ────────────────────────────────────────────────
      - name: "environment"
        factory: "temporal-reduce"
        config:
          in_pattern: "oteljson:///ingest/septicstation*.json"
          out_pattern: "data"
          time_column: "timestamp"
          resolutions: [1h, 6h, 1d, 1w]
          allowed_lateness: 14d
          aggregations:
            - type: "avg"
              columns:
                - "septicstation_temperature"
                - "septicstation_pressure"
                - "septicstation_humidity"
            - type: "min"
              columns:
                - "septicstation_temperature"
                - "septicstation_pressure"
                - "septicstation_humidity"
            - type: "max"
              columns:
                - "septicstation_temperature"
                - "septicstation_pressure"
                - "septicstation_humidity"
