<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
  <title id="title">Caspar Water pH adjustment system</title>
  <desc id="description">A full storage tank at left and equal-sized treatment plant at right are connected by a two-inch main leaving the bottom of the tank and continuing right with a square outlet and right-pointing flow arrow. At the lower left of the treatment plant, a take-off rises straight from the main and terminates at the lowest edge of a centrifugal pump volute. A widening spiral arrow sweeps around the volute toward its discharge. A discharge pipe starts at the volute's flat horizontal edge and rises in a straight line through a vertically oriented venturi injector and out through the plant roof before turning toward the tank. An air-suction tube leaves the injector through the plant's left wall to draw outdoor air. The return crosses above the tank, enters from the top, and reaches the center throat of a smooth, symmetric eductor profile that tapers from a large left bell and expands into a smaller right bell. One pair of curved arrows shows surrounding water entering the eductor from the right; a mirrored pair beneath the bubbles shows mixed water leaving to the left. Bubbles leave leftward and rise to promote carbon-dioxide off-gassing and raise pH, while a high screened opening in the tank's right wall vents the displaced air, shown by a pair of outward arrows. The treatment plant is labeled pH adjustment with air injection.</desc>
