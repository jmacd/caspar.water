    <marker id="airflow-arrow" viewBox="0 0 6 6" refX="5.5" refY="3"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#111827"/>
    </marker>
    <marker id="volute-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse"
            orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#111827"/>
    </marker>
    <style>
      .tank { fill: #fff; stroke: #365d7e; stroke-width: 3; }
      .plant { fill: #f4f8fc; stroke: #7894ae; stroke-width: 3; stroke-dasharray: 8 5; }
      .water-fill { fill: #dceef9; }
      .waterline { stroke: #4c9fd1; stroke-width: 3; }
      .tank-vent { fill: none; stroke: #365d7e; stroke-width: 3; stroke-linecap: round; }
      .vent-screen { fill: none; stroke: #365d7e; stroke-width: 1.25; stroke-dasharray: 1 1.5; }
      .main { fill: none; stroke: #0c4a6e; stroke-width: 16; stroke-linecap: butt; stroke-linejoin: round; }
      .return { fill: none; stroke: #0c4a6e; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .air { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }
      .airflow { fill: none; stroke: #111827; stroke-width: 1.5; stroke-linecap: round; marker-end: url(#airflow-arrow); }
      .main-flow { fill: none; stroke: #111827; stroke-width: 1.5; stroke-linecap: round; }
      .volute-flow { fill: none; stroke: #111827; stroke-width: 1.5; stroke-linecap: round; marker-end: url(#volute-arrow); }
      .equipment { fill: #e2e8f0; stroke: #64748b; stroke-width: 3; }
      .bubble { fill: #fff; stroke: #4c9fd1; stroke-width: 2; }
    </style>
  </defs>

